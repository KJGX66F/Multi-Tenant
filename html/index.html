<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Architecture & Status</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 580px; width: 100%; padding: 2.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .badge { display: inline-flex; align-items: center; background-color: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; margin-bottom: 1.25rem; }
        .badge-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; margin-right: 0.5rem; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #ffffff; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; border-top: 1px solid #334155; padding-top: 1.5rem; }
        .metric-item { display: flex; flex-direction: column; }
        .metric-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.25rem; }
        .metric-value { font-size: 1.125rem; font-weight: 600; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            Operational
        </div>
        <h1>Distributed Edge Gateway</h1>
        <p>Unified infrastructure runtime running on multi-tenant serverless nodes. Traffic routing, SSL verification, and edge caching are handled normally across all active zones.</p>
        <div class="metrics">
            <div class="metric-item">
                <span class="metric-label">Service Health</span>
                <span class="metric-value">100.0%</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">TLS Status</span>
                <span class="metric-value">Enabled</span>
            </div>
        </div>
    </div>
</body>
</html>
