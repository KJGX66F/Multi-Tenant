name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动点击按钮触发构建

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 登录 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 镜像名称必须全小写
          tags: ghcr.io/${{ github.repository_owner }}/multi-tenant:latest
